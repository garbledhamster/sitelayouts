<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Template Browser</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
        background: #f8f9fb;
        color: #333;
    }

    header {
        padding: 2rem 1rem;
        text-align: center;
        background: #4b3ba7;
        color: white;
        margin-bottom: 2rem;
    }

    h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 600;
    }

    .wrapper {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1rem;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1.5rem;
    }

    .card {
        background: white;
        padding: 1.5rem;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        text-align: center;
        transition: 0.2s ease;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .card h2 {
        margin-top: 0;
        font-size: 1.3rem;
        color: #4b3ba7;
    }

    .path {
        font-size: 0.85rem;
        opacity: 0.7;
        margin-top: 0.5rem;
        word-break: break-all;
    }
</style>
</head>

<body>
<header>
    <h1>Website Template Browser</h1>
    <p>Click a template to preview it</p>
</header>

<div class="wrapper">

    <!-- Template card 1 -->
    <a href="html5up/stellar/" class="card">
        <h2>HTML5UP – Stellar</h2>
        <div class="path">/html5up/stellar/</div>
    </a>

    <!-- Copy + paste blocks like this for more templates -->
    <!--
    <a href="html5up/solid-state/" class="card">
        <h2>HTML5UP – Solid State</h2>
        <div class="path">/html5up/solid-state/</div>
    </a>

    <a href="html5up/phantom/" class="card">
        <h2>HTML5UP – Phantom</h2>
        <div class="path">/html5up/phantom/</div>
    </a>
    -->

</div>

</body>
</html>
